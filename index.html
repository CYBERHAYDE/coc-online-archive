<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COC Igbogbo</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cocigbogbo.blogspot.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; font-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Church of Christ Igbogbo: church history, notices, blog and member records.">
<meta name="theme-color" content="#12294A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="COC Igbogbo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="boot" class="boot" role="status" aria-label="Loading">
  <img src="logo.png" alt="Church of Christ Igbogbo" width="200">
  <div class="spinner" aria-hidden="true"></div>
</div>

<div id="authRoot" hidden></div>

<div id="appRoot" class="app" hidden>
  <aside class="rail" id="rail" aria-label="Main"></aside>
  <div class="stage">
    <header class="top">
      <img class="top-logo" src="logo.png" alt="COC Igbogbo" height="34">
      <h1 class="top-title" id="topTitle">Home</h1>
      <span class="sync" id="syncStatus" role="status" aria-live="polite"></span>
      <button class="avatar" id="avatarBtn" data-act="account" aria-label="Your account"></button>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
</div>

<div id="sheetRoot" class="sheet-root" hidden>
  <div class="sheet-backdrop" data-act="sheet-close"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
    <div id="sheetBody"></div>
  </div>
</div>

<div id="dialogRoot" class="sheet-root dialog-root" hidden>
  <div class="sheet-backdrop"></div>
  <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialogTitle" tabindex="-1"></div>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="js/core.js"></script>
<script src="js/pwa.js"></script>
<script src="js/auth.js"></script>
<script src="js/views.js"></script>
<script src="js/admin.js"></script>
<script src="js/main.js"></script>
</body>
</html>
